services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tamreen
      POSTGRES_PASSWORD: tamreen
      POSTGRES_DB: tamreen
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tamreen -d tamreen']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
