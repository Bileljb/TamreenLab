name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # prisma.config.ts reads it; generate and the unit tests never connect.
  DATABASE_URL: postgresql://tamreen:tamreen@localhost:5432/tamreen?schema=public
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tamreen
          POSTGRES_PASSWORD: tamreen
          POSTGRES_DB: tamreen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tamreen -d tamreen_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm content:lint
      - name: API integration tests (Postgres)
        run: |
          pnpm --filter @tamreen/api exec prisma migrate deploy
          pnpm --filter @tamreen/api test:int
        env:
          DATABASE_URL: postgresql://tamreen:tamreen@localhost:5432/tamreen_test?schema=public
          DATABASE_URL_TEST: postgresql://tamreen:tamreen@localhost:5432/tamreen_test?schema=public
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    env:
      DATABASE_URL: postgresql://tamreen:tamreen@localhost:5432/tamreen?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tamreen
          POSTGRES_PASSWORD: tamreen
          POSTGRES_DB: tamreen
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tamreen -d tamreen"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tamreen/web exec playwright install --with-deps chromium
      - run: pnpm turbo run build --filter=@tamreen/web --filter=@tamreen/api
      - name: Database with the curriculum
        run: |
          pnpm --filter @tamreen/api exec prisma migrate deploy
          pnpm content:sync
      - run: pnpm e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
